name: Application Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must match vMAJOR.MINOR.PATCH."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B --no-transfer-progress clean verify

      - name: Resolve packaged JAR name
        id: jar
        run: |
          echo "name=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.build.finalName)" >> "$GITHUB_OUTPUT"

      - name: Copy release JAR
        shell: bash
        run: |
          cp "target/${{ steps.jar.outputs.name }}.jar" "target/insurance-refactoring-demo-${GITHUB_REF_NAME}.jar"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "target/insurance-refactoring-demo-${GITHUB_REF_NAME}.jar" \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
